name: terraform and ansible checks

permissions:
  contents: read

on:
  pull_request:
    branches: [terraform-aws-cloud]
    paths:
      - 'terraform/**'
      - 'ansible/**'
  push:
    branches: [terraform-aws-cloud]
    paths:
      - 'terraform/**'
      - 'ansible/**'

jobs:
  terraform-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: terraform fmt check
        run: terraform fmt -check -recursive terraform/

      - name: terraform init and validate
        run: |
          for dir in terraform/bootstrap terraform/environments/aws-cloud terraform/modules/*/; do
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done

      - uses: terraform-linters/setup-tflint@v6

      - name: tflint
        run: |
          for dir in terraform/bootstrap terraform/environments/aws-cloud terraform/modules/*/; do
            tflint --chdir="$dir" --init
            tflint --chdir="$dir"
          done

      - name: checkov
        uses: bridgecrewio/checkov-action@v12.3114.0
        with:
          directory: terraform/
          soft_fail: false
          skip_check: CKV_AWS_273,CKV_AWS_40

  ansible-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install ansible-lint and collections
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-lint==26.6.0
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: run ansible-lint
        run: |
          cd ansible
          ansible-lint playbooks/*.yml

  infracost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: infracost breakdown
        run: |
          infracost breakdown --path terraform/environments/aws-cloud \
            --format table \
            --out-file infracost-report.txt

      - name: post cost estimate
        run: cat infracost-report.txt
