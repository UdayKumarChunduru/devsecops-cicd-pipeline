apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: devsecops-real
  region: us-east-1
  version: "1.36"

iam:
  withOIDC: true

managedNodeGroups:
  - name: devsecops-workers
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 20
    labels:
      role: worker
    tags:
      project: devsecops-pipeline
