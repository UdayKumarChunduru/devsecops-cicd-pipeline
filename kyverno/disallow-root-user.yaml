apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-user
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - falco
                - monitoring
                - logging
      validate:
        message: "Pods must run as non-root. Set securityContext.runAsNonRoot true."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
