---
- name: Provision AWS cloud real environment with Terraform
  hosts: local
  gather_facts: false
  vars_files:
    - ../group_vars/all/vars.yml

  tasks:
    - name: Run terraform init for the real environment
      ansible.builtin.command:
        cmd: terraform init -input=false
        chdir: "{{ terraform_dir }}"
      changed_when: true

    - name: Run terraform apply for the real environment
      ansible.builtin.command:
        cmd: terraform apply -auto-approve -input=false
        chdir: "{{ terraform_dir }}"
      register: tf_apply
      changed_when: "'Apply complete' in tf_apply.stdout"
      no_log: true

    - name: Read terraform outputs as json
      no_log: true
      ansible.builtin.command:
        cmd: terraform output -json
        chdir: "{{ terraform_dir }}"
      register: tf_outputs_raw
      changed_when: false

    - name: Parse terraform outputs
      no_log: true
      ansible.builtin.set_fact:
        tf_outputs: "{{ tf_outputs_raw.stdout | from_json }}"

    - name: Persist terraform outputs to a local facts file for other playbooks
      ansible.builtin.copy:
        content: "{{ tf_outputs | to_nice_json }}"
        dest: "{{ project_root }}/.terraform-outputs.json"
        mode: "0600"

    - name: Wait for the ec2 instance to register with systems manager
      ansible.builtin.command:
        cmd: >
          aws ssm describe-instance-information
          --filters "Key=InstanceIds,Values={{ tf_outputs.instance_id.value }}"
          --region {{ aws_region }}
          --query "InstanceInformationList[0].PingStatus"
          --output text
      register: ssm_ping
      until: ssm_ping.stdout == "Online"
      retries: 30
      delay: 20
      changed_when: false

    - name: Poll EC2 instance until the bootstrap completion or failure marker is present
      ansible.builtin.shell: |
        CMD_ID=$(aws ssm send-command \
          --instance-ids {{ tf_outputs.instance_id.value }} \
          --document-name "AWS-RunShellScript" \
          --parameters commands="if test -f /opt/devsecops/bootstrap-complete; then echo BOOTSTRAP_COMPLETE; elif test -f /opt/devsecops/bootstrap-failed; then echo BOOTSTRAP_FAILED; else echo BOOTSTRAP_PENDING; fi" \
          --region {{ aws_region }} \
          --query "Command.CommandId" \
          --output text)
        sleep 3
        aws ssm get-command-invocation \
          --command-id "$CMD_ID" \
          --instance-id {{ tf_outputs.instance_id.value }} \
          --region {{ aws_region }} \
          --query "StandardOutputContent" \
          --output text
      register: bootstrap_status
      until: "'BOOTSTRAP_COMPLETE' in bootstrap_status.stdout or 'BOOTSTRAP_FAILED' in bootstrap_status.stdout"
      retries: 200
      delay: 20
      failed_when: false
      changed_when: false

    - name: Fetch the bootstrap failure reason if the script crashed
      ansible.builtin.command:
        cmd: >
          aws ssm send-command
          --instance-ids {{ tf_outputs.instance_id.value }}
          --document-name "AWS-RunShellScript"
          --parameters commands="cat /opt/devsecops/bootstrap-failed"
          --region {{ aws_region }}
          --query "Command.CommandId"
          --output text
      register: failure_reason_cmd
      when: "'BOOTSTRAP_FAILED' in bootstrap_status.stdout"
      changed_when: false

    - name: Pause for the failure reason command to complete
      ansible.builtin.pause:
        seconds: 5
      when: "'BOOTSTRAP_FAILED' in bootstrap_status.stdout"

    - name: Retrieve the bootstrap failure reason
      ansible.builtin.command:
        cmd: >
          aws ssm get-command-invocation
          --command-id {{ failure_reason_cmd.stdout }}
          --instance-id {{ tf_outputs.instance_id.value }}
          --region {{ aws_region }}
          --query "StandardOutputContent"
          --output text
      register: failure_reason
      when: "'BOOTSTRAP_FAILED' in bootstrap_status.stdout"
      changed_when: false

    - name: Fetch the last 150 lines of the full bootstrap log for diagnosis
      ansible.builtin.command:
        cmd: >
          aws ssm send-command
          --instance-ids {{ tf_outputs.instance_id.value }}
          --document-name "AWS-RunShellScript"
          --parameters commands="tail -n 150 /var/log/user-data.log"
          --region {{ aws_region }}
          --query "Command.CommandId"
          --output text
      register: log_fetch_cmd
      when: "'BOOTSTRAP_COMPLETE' not in bootstrap_status.stdout"
      changed_when: false

    - name: Pause for the log fetch command to complete
      ansible.builtin.pause:
        seconds: 5
      when: "'BOOTSTRAP_COMPLETE' not in bootstrap_status.stdout"

    - name: Retrieve the tail of the bootstrap log
      ansible.builtin.command:
        cmd: >
          aws ssm get-command-invocation
          --command-id {{ log_fetch_cmd.stdout }}
          --instance-id {{ tf_outputs.instance_id.value }}
          --region {{ aws_region }}
          --query "StandardOutputContent"
          --output text
      register: bootstrap_log
      when: "'BOOTSTRAP_COMPLETE' not in bootstrap_status.stdout"
      changed_when: false

    - name: Print the bootstrap failure reason and log tail
      ansible.builtin.debug:
        msg:
          - "failure reason: {{ failure_reason.stdout | default('none, this was a timeout not a crash') }}"
          - "{{ bootstrap_log.stdout_lines | default([]) }}"
      when: "'BOOTSTRAP_COMPLETE' not in bootstrap_status.stdout"

    - name: Fail loudly if bootstrap did not complete successfully
      ansible.builtin.fail:
        msg: "jenkins and sonarqube bootstrap on the ec2 instance did not complete, see the failure reason and log tail printed above"
      when: "'BOOTSTRAP_COMPLETE' not in bootstrap_status.stdout"

    - name: Read jenkins and sonarqube credentials from secrets manager
      no_log: true
      ansible.builtin.command:
        cmd: >
          aws secretsmanager get-secret-value --secret-id devsecops-pipeline/{{ item }}
          --region {{ aws_region }} --query SecretString --output text
      register: secret_values
      changed_when: false
      loop:
        - jenkins-admin-user
        - jenkins-admin-password
        - sonar-admin-password

    - name: Write local pipeline credentials summary file
      no_log: true
      ansible.builtin.copy:
        dest: "{{ project_root }}/.pipeline-credentials"
        mode: "0600"
        content: |
          JENKINS_URL=http://localhost:8080 (SSM tunnel started automatically by make aws-cloud / make infra)
          JENKINS_ADMIN_USER={{ secret_values.results[0].stdout }}
          JENKINS_ADMIN_PASSWORD={{ secret_values.results[1].stdout }}
          SONARQUBE_URL=http://localhost:9000/sonarqube (SSM tunnel started automatically by make aws-cloud / make infra)
          SONAR_ADMIN_USER=admin
          SONAR_ADMIN_PASSWORD={{ secret_values.results[2].stdout }}
          AWS_ACCOUNT_ID={{ tf_outputs.aws_account_id.value }}
          INSTANCE_ID={{ tf_outputs.instance_id.value }}
          ALB_DNS_NAME={{ tf_outputs.alb_dns_name.value }}

    - name: Terminate any existing stale local SSM tunnels on ports 8080 or 9000
      ansible.builtin.shell: |
        pkill -f "AWS-StartPortForwardingSession.*8080" || true
        pkill -f "AWS-StartPortForwardingSession.*9000" || true
      changed_when: false
      failed_when: false

    - name: Automatically spawn background AWS SSM port-forwarding tunnels for Jenkins and SonarQube
      ansible.builtin.shell: |
        nohup aws ssm start-session --target {{ tf_outputs.instance_id.value }} --document-name AWS-StartPortForwardingSession --parameters '{"portNumber":["8080"],"localPortNumber":["8080"]}' --region {{ aws_region }} >/dev/null 2>&1 &
        nohup aws ssm start-session --target {{ tf_outputs.instance_id.value }} --document-name AWS-StartPortForwardingSession --parameters '{"portNumber":["9000"],"localPortNumber":["9000"]}' --region {{ aws_region }} >/dev/null 2>&1 &
      changed_when: true

    - name: Confirm credentials file was written and tunnels started
      ansible.builtin.debug:
        msg: "Credentials written to .pipeline-credentials. Localhost SSM tunnels for ports 8080 and 9000 are running in the background!"
