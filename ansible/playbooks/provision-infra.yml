---
- name: Provision AWS infrastructure with Terraform
  hosts: local
  gather_facts: false
  vars_files:
    - ../group_vars/all/vars.yml

  tasks:
    - name: Run terraform init
      ansible.builtin.command:
        cmd: terraform init -input=false
        chdir: "{{ terraform_dir }}"
      changed_when: true

    - name: Run terraform apply
      ansible.builtin.command:
        cmd: terraform apply -auto-approve -input=false
        chdir: "{{ terraform_dir }}"
      register: tf_apply
      changed_when: "'Apply complete' in tf_apply.stdout"

    - name: Read terraform outputs as json
      ansible.builtin.command:
        cmd: terraform output -json
        chdir: "{{ terraform_dir }}"
      register: tf_outputs_raw
      changed_when: false

    - name: Parse terraform outputs
      ansible.builtin.set_fact:
        tf_outputs: "{{ tf_outputs_raw.stdout | from_json }}"

    - name: Persist terraform outputs to a local facts file for other playbooks
      ansible.builtin.copy:
        content: "{{ tf_outputs | to_nice_json }}"
        dest: "{{ project_root }}/.terraform-outputs.json"
        mode: "0600"
