---
- name: Provision AWS infrastructure with Terraform
  hosts: local
  gather_facts: false
  vars_files:
    - ../group_vars/all/vars.yml

  tasks:
    - name: Run terraform init for state backend bootstrap
      ansible.builtin.command:
        cmd: terraform init -input=false
        chdir: "{{ project_root }}/terraform/bootstrap"
      changed_when: true

    - name: Run terraform apply for state backend bootstrap
      ansible.builtin.command:
        cmd: terraform apply -auto-approve -input=false
        chdir: "{{ project_root }}/terraform/bootstrap"
      register: tf_bootstrap_apply
      changed_when: "'Apply complete' in tf_bootstrap_apply.stdout"

    - name: Read bootstrap outputs as json
      ansible.builtin.command:
        cmd: terraform output -json
        chdir: "{{ project_root }}/terraform/bootstrap"
      register: tf_bootstrap_outputs_raw
      changed_when: false

    - name: Show the github actions role arn, set this once as the AWS_GITHUB_ACTIONS_ROLE_ARN github secret
      ansible.builtin.debug:
        msg: "{{ (tf_bootstrap_outputs_raw.stdout | from_json).github_actions_role_arn.value }}"

    - name: Run terraform init for the real environment
      ansible.builtin.command:
        cmd: terraform init -input=false
        chdir: "{{ terraform_dir }}"
      changed_when: true

    - name: Run terraform apply for the real environment
      ansible.builtin.command:
        cmd: terraform apply -auto-approve -input=false
        chdir: "{{ terraform_dir }}"
      register: tf_apply
      changed_when: "'Apply complete' in tf_apply.stdout"
      no_log: true

    - name: Read terraform outputs as json
      no_log: true
      ansible.builtin.command:
        cmd: terraform output -json
        chdir: "{{ terraform_dir }}"
      register: tf_outputs_raw
      changed_when: false

    - name: Parse terraform outputs
      no_log: true
      ansible.builtin.set_fact:
        tf_outputs: "{{ tf_outputs_raw.stdout | from_json }}"

    - name: Persist terraform outputs to a local facts file for other playbooks
      ansible.builtin.copy:
        content: "{{ tf_outputs | to_nice_json }}"
        dest: "{{ project_root }}/.terraform-outputs.json"
        mode: "0600"

    - name: Wait for the ec2 instance to register with systems manager
      ansible.builtin.command:
        cmd: >
          aws ssm describe-instance-information
          --filters "Key=InstanceIds,Values={{ tf_outputs.instance_id.value }}"
          --region {{ aws_region }}
          --query "InstanceInformationList[0].PingStatus"
          --output text
      register: ssm_ping
      until: ssm_ping.stdout == "Online"
      retries: 30
      delay: 20
      changed_when: false

    - name: Wait for the jenkins and sonarqube bootstrap script to finish on the instance
      ansible.builtin.command:
        cmd: >
          aws ssm send-command
          --instance-ids {{ tf_outputs.instance_id.value }}
          --document-name "AWS-RunShellScript"
          --parameters commands="test -f /opt/devsecops/bootstrap-complete"
          --region {{ aws_region }}
          --query "Command.CommandId"
          --output text
      register: bootstrap_check_cmd
      changed_when: false

    - name: Pause for the bootstrap check command to run
      ansible.builtin.pause:
        seconds: 5

    - name: Poll bootstrap completion marker
      ansible.builtin.command:
        cmd: >
          aws ssm get-command-invocation
          --command-id {{ bootstrap_check_cmd.stdout }}
          --instance-id {{ tf_outputs.instance_id.value }}
          --region {{ aws_region }}
          --query "Status"
          --output text
      register: bootstrap_status
      until: bootstrap_status.stdout in ["Success", "Failed"]
      retries: 60
      delay: 20
      failed_when: false
      changed_when: false

    - name: Fetch the full user-data bootstrap log from the instance
      ansible.builtin.command:
        cmd: >
          aws ssm send-command
          --instance-ids {{ tf_outputs.instance_id.value }}
          --document-name "AWS-RunShellScript"
          --parameters commands="cat /var/log/cloud-init-output.log"
          --region {{ aws_region }}
          --query "Command.CommandId"
          --output text
      register: log_fetch_cmd
      changed_when: false

    - name: Pause for the log fetch command to run
      ansible.builtin.pause:
        seconds: 10

    - name: Display the bootstrap log
      ansible.builtin.command:
        cmd: >
          aws ssm get-command-invocation
          --command-id {{ log_fetch_cmd.stdout }}
          --instance-id {{ tf_outputs.instance_id.value }}
          --region {{ aws_region }}
          --query "StandardOutputContent"
          --output text
      register: bootstrap_log
      changed_when: false

    - name: Print the bootstrap log to this terminal
      ansible.builtin.debug:
        msg: "{{ bootstrap_log.stdout_lines }}"

    - name: Fail loudly if bootstrap did not complete successfully
      ansible.builtin.fail:
        msg: "jenkins and sonarqube bootstrap on the ec2 instance did not complete, see the log printed above for the exact failure"
      when: bootstrap_status.stdout != "Success"

    - name: Read jenkins and sonarqube credentials from secrets manager
      no_log: true
      ansible.builtin.command:
        cmd: >
          aws secretsmanager get-secret-value --secret-id devsecops-pipeline/{{ item }}
          --region {{ aws_region }} --query SecretString --output text
      register: secret_values
      changed_when: false
      loop:
        - jenkins-admin-user
        - jenkins-admin-password
        - sonar-admin-password

    - name: Write local pipeline credentials summary file
      no_log: true
      ansible.builtin.copy:
        dest: "{{ project_root }}/.pipeline-credentials"
        mode: "0600"
        content: |
          JENKINS_URL=http://localhost:8080 (after starting the ssm tunnel, see README)
          JENKINS_ADMIN_USER={{ secret_values.results[0].stdout }}
          JENKINS_ADMIN_PASSWORD={{ secret_values.results[1].stdout }}
          SONARQUBE_URL=http://localhost:9000/sonarqube (after starting the ssm tunnel, see README)
          SONAR_ADMIN_USER=admin
          SONAR_ADMIN_PASSWORD={{ secret_values.results[2].stdout }}
          AWS_ACCOUNT_ID={{ tf_outputs.aws_account_id.value }}
          INSTANCE_ID={{ tf_outputs.instance_id.value }}
          ALB_DNS_NAME={{ tf_outputs.alb_dns_name.value }}

    - name: Confirm credentials file was written
      ansible.builtin.debug:
        msg: "credentials written to .pipeline-credentials, run cat .pipeline-credentials to view"
