---
- name: Tear down the terraform-aws branch stack
  hosts: local
  gather_facts: false
  vars_files:
    - ../group_vars/all/vars.yml

  tasks:
    - name: Check if a cluster is reachable
      ansible.builtin.command:
        cmd: kubectl get nodes
      register: cluster_check
      failed_when: false
      changed_when: false

    - name: Uninstall falco
      kubernetes.core.helm:
        name: falco
        release_namespace: falco
        state: absent
      when: cluster_check.rc == 0
      failed_when: false

    - name: Uninstall kyverno
      kubernetes.core.helm:
        name: kyverno
        release_namespace: kyverno
        state: absent
      when: cluster_check.rc == 0
      failed_when: false

    - name: Stop local docker containers, networks, and named volumes
      community.docker.docker_compose_v2:
        project_src: "{{ project_root }}"
        state: absent
        remove_volumes: true
        remove_orphans: true
      failed_when: false

    - name: Force purge leftover anonymous volumes specific ONLY to this project
      ansible.builtin.shell: |
        docker volume prune --force --filter "label=com.docker.compose.project={{ project_root | basename }}"
      changed_when: true
      failed_when: false

    - name: Destroy terraform managed infra
      ansible.builtin.command:
        cmd: terraform destroy -auto-approve -input=false
        chdir: "{{ terraform_dir }}"
      register: infra_destroy
      changed_when: true
      failed_when: false

    - name: Destroy state backend bootstrap resources
      ansible.builtin.command:
        cmd: terraform destroy -auto-approve -input=false
        chdir: "{{ project_root }}/terraform/bootstrap"
      register: bootstrap_destroy
      changed_when: true
      failed_when: false

    - name: Force delete remediation lambda
      amazon.aws.lambda:
        name: "falco-remediation"
        state: absent
        region: "{{ aws_region }}"
      failed_when: false

    - name: Scan for any lingering resources tagged for this project
      ansible.builtin.command: >
        aws resourcegroupstaggingapi get-resources
        --region us-east-1
        --tag-filters Key=project,Values=devsecops-pipeline
        --query "ResourceTagMappingList[*].ResourceARN"
        --output json
      register: active_resources
      changed_when: false
      failed_when: false

    - name: Report any lingering project resources
      ansible.builtin.debug:
        msg: "{{ active_resources.stdout | from_json }}"
      when:
        - active_resources.stdout is defined
        - (active_resources.stdout | from_json | length) > 0

    - name: Confirm clean teardown when nothing lingers
      ansible.builtin.debug:
        msg: "no project tagged resources remain in us-east-1"
      when:
        - active_resources.stdout is defined
        - (active_resources.stdout | from_json | length) == 0

    - name: Remove terraform metadata recursively
      ansible.builtin.shell: |
        find "{{ project_root }}/terraform" -type d -name ".terraform" -prune -exec rm -rf {} +
        find "{{ project_root }}/terraform" -name ".terraform.lock.hcl" -delete
        find "{{ project_root }}/terraform" -name "terraform.tfstate" -delete
        find "{{ project_root }}/terraform" -name "terraform.tfstate.backup" -delete
        rm -f "{{ project_root }}/.terraform-outputs.json"
      when:
        - infra_destroy.rc == 0
        - bootstrap_destroy.rc == 0
      changed_when: true
      failed_when: false

    - name: Remove local build artifacts, generated secrets, and tooling caches
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ lambda_dir }}/lambda-package"
        - "{{ lambda_dir }}/falco_remediation.zip"
        - "{{ project_root }}/.secrets"
        - "{{ project_root }}/jenkins/casc.yaml"
        - "{{ project_root }}/.pipeline-credentials"
        - "{{ project_root }}/.ansible"

    - name: Find and remove pycache and pytest cache directories
      ansible.builtin.shell: |
        find "{{ project_root }}" -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null
        find "{{ project_root }}" -type d -name ".pytest_cache" -exec rm -rf {} + 2>/dev/null
        find "{{ project_root }}" -name "sbom-*.json" -delete 2>/dev/null
        find "{{ project_root }}" -name "gitleaks-report.json" -delete 2>/dev/null
      changed_when: false

    - name: Teardown and local cleanup complete
      ansible.builtin.debug:
        msg: |
          Local cleanup complete! Removed .ansible and all terraform metadata (.terraform directories, state, and lock files).
          Note: vault.yml and .vault_pass are kept intentionally so your snyk token and vault encryption survive across sessions.

          Teardown complete. Please run the following to confirm nothing billable remains:
          - aws eks list-clusters
          - aws ecr describe-repositories
          - aws lambda list-functions
