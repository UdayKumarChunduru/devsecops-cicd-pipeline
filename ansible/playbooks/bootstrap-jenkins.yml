---
- name: Bootstrap Jenkins and SonarQube
  hosts: local
  gather_facts: false
  vars_files:
    - ../group_vars/all/vars.yml
    - ../group_vars/all/vault.yml

  tasks:
    - name: Load terraform outputs
      no_log: true
      ansible.builtin.set_fact:
        tf_outputs: "{{ lookup('file', project_root + '/.terraform-outputs.json') | from_json }}"

    - name: Verify vault variables are actually loaded
      ansible.builtin.assert:
        that:
          - vault_jenkins_admin_user is defined
          - vault_snyk_token is defined
          - vault_snyk_token != "paste-snyk-api-token-here"
        fail_msg: >
          ansible/group_vars/all/vault.yml is missing, empty, or still has
          placeholder values. run make vault-setup, edit the file with your
          real snyk token, then rerun make up.
        success_msg: "vault variables loaded correctly"

    - name: Ensure secrets directory exists
      ansible.builtin.file:
        path: "{{ project_root }}/.secrets"
        state: directory
        mode: "0700"

    - name: Generate or read jenkins admin password
      no_log: true
      ansible.builtin.set_fact:
        jenkins_admin_password: "{{ lookup('ansible.builtin.password', project_root + '/.secrets/jenkins_admin_password', chars=['ascii_letters', 'digits', '!@%^&*_-+=']) }}"

    - name: Generate or read sonarqube admin password
      no_log: true
      ansible.builtin.set_fact:
        sonar_admin_password: "{{ lookup('ansible.builtin.password', project_root + '/.secrets/sonar_admin_password', chars=['ascii_letters', 'digits', '!@%^&*_-+=']) }}"

    - name: Render docker-compose.yml
      ansible.builtin.template:
        src: ../files/docker-compose.yml.j2
        dest: "{{ project_root }}/docker-compose.yml"
        mode: "0644"

    - name: Start sonarqube container
      community.docker.docker_compose_v2:
        project_src: "{{ project_root }}"
        services: [sonarqube]
        state: present

    - name: Wait for sonarqube to respond
      # checkov:skip=CKV2_ANSIBLE_1:target is 127.0.0.1 only, jenkins and sonarqube are local docker containers on the same host running this playbook, traffic never leaves the machine
      ansible.builtin.uri:
        url: "http://localhost:9000/api/system/status"
        status_code: [200, 404, 500, 503]
      register: sonar_status
      until: sonar_status.status == 200 and sonar_status.json is defined and sonar_status.json.status is defined and sonar_status.json.status == "UP"
      retries: 60
      delay: 10
      ignore_errors: true

    - name: Check if the generated sonar password already works
      # checkov:skip=CKV2_ANSIBLE_1:target is 127.0.0.1 only, jenkins and sonarqube are local docker containers on the same host running this playbook, traffic never leaves the machine
      ansible.builtin.uri:
        url: "http://localhost:9000/api/authentication/validate"
        url_username: admin
        url_password: "{{ sonar_admin_password }}"
        force_basic_auth: true
        status_code: 200
      register: sonar_login_check
      retries: 5
      delay: 5
      until: sonar_login_check.status == 200

    - name: Report stored sonar password state
      ansible.builtin.debug:
        msg: >-
          {{ 'stored sonarqube password already valid, skipping password change'
          if sonar_login_check.json.valid
          else 'stored sonarqube password not valid, checking default admin credential next' }}

    - name: Check if the sonarqube default admin credential still works
      # checkov:skip=CKV2_ANSIBLE_1:target is 127.0.0.1 only, jenkins and sonarqube are local docker containers on the same host running this playbook, traffic never leaves the machine
      ansible.builtin.uri:
        url: "http://localhost:9000/api/authentication/validate"
        url_username: admin
        url_password: admin
        force_basic_auth: true
        status_code: 200
      register: sonar_default_check
      when: not sonar_login_check.json.valid

    - name: Fail loudly if neither the stored nor the default sonar credential is valid
      ansible.builtin.fail:
        msg: >
          sonarqube admin password is in an unknown state. neither the password stored in
          .secrets/sonar_admin_password nor the default admin/admin credential is accepted.
          this happens when the sonarqube_data docker volume survived from an earlier
          session while .secrets/sonar_admin_password was deleted or regenerated separately.
          fix: docker compose down -v to drop the sonarqube_data volume, then rerun make jenkins.
      when:
        - not sonar_login_check.json.valid
        - not sonar_default_check.json.valid

    - name: Change sonarqube default admin password
      # checkov:skip=CKV2_ANSIBLE_1:target is 127.0.0.1 only, jenkins and sonarqube are local docker containers on the same host running this playbook, traffic never leaves the machine
      no_log: true
      ansible.builtin.uri:
        url: "http://localhost:9000/api/users/change_password"
        method: POST
        url_username: admin
        url_password: admin
        force_basic_auth: true
        body_format: form-urlencoded
        body:
          login: admin
          previousPassword: admin
          password: "{{ sonar_admin_password }}"
        status_code: [200, 204]
      when:
        - not sonar_login_check.json.valid
        - sonar_default_check.json.valid

    - name: Confirm the sonar password change took effect
      ansible.builtin.debug:
        msg: "sonarqube admin password changed successfully from default to the value stored in .secrets/sonar_admin_password"
      when:
        - not sonar_login_check.json.valid
        - sonar_default_check.json.valid

    - name: Revoke any existing jenkins sonar token
      # checkov:skip=CKV2_ANSIBLE_1:target is 127.0.0.1 only, jenkins and sonarqube are local docker containers on the same host running this playbook, traffic never leaves the machine
      ansible.builtin.uri:
        url: "http://localhost:9000/api/user_tokens/revoke"
        method: POST
        url_username: admin
        url_password: "{{ sonar_admin_password }}"
        force_basic_auth: true
        body_format: form-urlencoded
        body:
          name: jenkins
        status_code: [200, 204]
      failed_when: false

    - name: Generate a fresh sonar token for jenkins
      # checkov:skip=CKV2_ANSIBLE_1:target is 127.0.0.1 only, jenkins and sonarqube are local docker containers on the same host running this playbook, traffic never leaves the machine
      no_log: true
      ansible.builtin.uri:
        url: "http://localhost:9000/api/user_tokens/generate"
        method: POST
        url_username: admin
        url_password: "{{ sonar_admin_password }}"
        force_basic_auth: true
        body_format: form-urlencoded
        body:
          name: jenkins
        status_code: 200
      register: sonar_token_response

    - name: Save sonar token as a fact
      ansible.builtin.set_fact:
        sonar_token: "{{ sonar_token_response.json.token }}"

    - name: List existing sonarqube webhooks
      # checkov:skip=CKV2_ANSIBLE_1:target is 127.0.0.1 only, jenkins and sonarqube are local docker containers on the same host running this playbook, traffic never leaves the machine
      ansible.builtin.uri:
        url: "http://localhost:9000/api/webhooks/list"
        url_username: admin
        url_password: "{{ sonar_admin_password }}"
        force_basic_auth: true
        status_code: 200
      register: sonar_webhooks

    - name: Create jenkins webhook in sonarqube
      # checkov:skip=CKV2_ANSIBLE_1:target is 127.0.0.1 only, jenkins and sonarqube are local docker containers on the same host running this playbook, traffic never leaves the machine
      ansible.builtin.uri:
        url: "http://localhost:9000/api/webhooks/create"
        method: POST
        url_username: admin
        url_password: "{{ sonar_admin_password }}"
        force_basic_auth: true
        body_format: form-urlencoded
        body:
          name: jenkins
          url: "http://jenkins:8080/sonarqube-webhook/"
        status_code: 200
      when: sonar_webhooks.json.webhooks | selectattr('name', 'equalto', 'jenkins') | list | length == 0

    - name: Ensure jenkins directory exists
      ansible.builtin.file:
        path: "{{ project_root }}/jenkins"
        state: directory
        mode: "0755"

    - name: Render jenkins casc.yaml with real values
      ansible.builtin.template:
        src: ../files/casc.yaml.j2
        dest: "{{ project_root }}/jenkins/casc.yaml"
        mode: "0600"
      vars:
        jenkins_admin_user: "{{ vault_jenkins_admin_user }}"
        snyk_token: "{{ vault_snyk_token }}"
        aws_account_id: "{{ tf_outputs.aws_account_id.value }}"
        jenkins_access_key_id: "{{ tf_outputs.jenkins_access_key_id.value }}"
        jenkins_secret_access_key: "{{ tf_outputs.jenkins_secret_access_key.value }}"

    - name: Build and start jenkins container
      community.docker.docker_compose_v2:
        project_src: "{{ project_root }}"
        services: [jenkins]
        build: always
        state: present

    - name: Wait for jenkins to respond
      # checkov:skip=CKV2_ANSIBLE_1:target is 127.0.0.1 only, jenkins and sonarqube are local docker containers on the same host running this playbook, traffic never leaves the machine
      ansible.builtin.uri:
        url: "http://localhost:8080/login"
        status_code: 200
      register: jenkins_up
      until: jenkins_up.status == 200
      retries: 60
      delay: 10

    - name: Fetch jenkins csrf crumb
      # checkov:skip=CKV2_ANSIBLE_1:target is 127.0.0.1 only, jenkins and sonarqube are local docker containers on the same host running this playbook, traffic never leaves the machine
      no_log: true
      ansible.builtin.uri:
        url: "http://localhost:8080/crumbIssuer/api/json"
        url_username: "{{ vault_jenkins_admin_user }}"
        url_password: "{{ jenkins_admin_password }}"
        force_basic_auth: true
        status_code: 200
        return_content: true
      register: crumb_response

    - name: Confirm the pipeline job exists before triggering
      no_log: true
      ansible.builtin.uri:
        url: "http://localhost:8080/job/devsecops-pipeline/api/json"
        url_username: "{{ vault_jenkins_admin_user }}"
        url_password: "{{ jenkins_admin_password }}"
        force_basic_auth: true
        status_code: [200, 404]
      register: job_exists_check

    - name: Build headers for Jenkins API call
      ansible.builtin.set_fact:
        jenkins_headers: >-
          {{
            {
              crumb_response.json.crumbRequestField: crumb_response.json.crumb,
              'Cookie': crumb_response.cookies_string | default('')
            }
          }}
      no_log: true

    - name: Trigger the devsecops-pipeline build
      # checkov:skip=CKV2_ANSIBLE_1:target is 127.0.0.1 only, jenkins and sonarqube are local docker containers on the same host running this playbook, traffic never leaves the machine
      no_log: true
      ansible.builtin.uri:
        url: "http://localhost:8080/job/devsecops-pipeline/build"
        method: POST
        url_username: "{{ vault_jenkins_admin_user }}"
        url_password: "{{ jenkins_admin_password }}"
        force_basic_auth: true
        headers: "{{ jenkins_headers }}"
        body_format: form-urlencoded
        body: {}
        status_code: [200, 201, 302]
      register: build_trigger_result
      ignore_errors: true

    - name: Report build trigger outcome without leaking auth material
      ansible.builtin.debug:
        msg: "build trigger returned http status {{ build_trigger_result.status | default('no response') }}"

    - name: Fail loudly if the trigger did not succeed
      ansible.builtin.fail:
        msg: "build trigger failed with status {{ build_trigger_result.status | default('unknown') }}, check jenkins container logs"
      when: build_trigger_result.status is not defined or build_trigger_result.status not in [200, 201, 302]

    - name: Write local credentials summary file
      no_log: true
      ansible.builtin.copy:
        dest: "{{ project_root }}/.pipeline-credentials"
        mode: "0600"
        content: |
          JENKINS_URL=http://localhost:8080
          JENKINS_ADMIN_USER={{ vault_jenkins_admin_user }}
          JENKINS_ADMIN_PASSWORD={{ jenkins_admin_password }}
          SONARQUBE_URL=http://localhost:9000
          SONAR_ADMIN_USER=admin
          SONAR_ADMIN_PASSWORD={{ sonar_admin_password }}
          SONAR_TOKEN={{ sonar_token }}
          AWS_ACCOUNT_ID={{ tf_outputs.aws_account_id.value }}
          AWS_JENKINS_ACCESS_KEY_ID={{ tf_outputs.jenkins_access_key_id.value }}
