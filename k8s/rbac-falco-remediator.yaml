apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: falco-remediator
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: falco-remediator-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: falco-remediator
    namespace: default
roleRef:
  kind: Role
  name: falco-remediator
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco-remediator
  namespace: default
