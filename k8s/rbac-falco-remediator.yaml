apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: falco-remediator
  namespace: devsecops-pipeline
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: falco-remediator-binding
  namespace: devsecops-pipeline
subjects:
  - kind: Group
    name: falco-remediator-group
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: falco-remediator
  apiGroup: rbac.authorization.k8s.io
