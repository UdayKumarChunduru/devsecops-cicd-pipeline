apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-service
  namespace: devsecops-pipeline
  labels:
    app: demo-service
  annotations:
    checkov.io/skip1: CKV_K8S_43=IMAGE_PLACEHOLDER is substituted with build_number:$BUILD_NUMBER by the jenkinsfile at deploy time, a fixed unique tag per build, digest pinning would require an extra pipeline step to resolve and inject the pushed image digest after push, not implemented for this project's scope
    checkov.io/skip2: CKV_K8S_14=same reason, the committed template cannot show a resolved tag since the tag is injected per build by the jenkinsfile sed step
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-service
  template:
    metadata:
      labels:
        app: demo-service
        quarantine: "false"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-service
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
